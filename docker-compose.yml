version: "3.9"

services:
  # ─── Next.js Web App ───────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: weknoq_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://weknoq:${POSTGRES_PASSWORD}@postgres:5432/weknoq
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - weknoq_net

  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: weknoq_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: weknoq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: weknoq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weknoq"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weknoq_net

  # ─── Redis (caching YouTube API responses) ─────────────────
  redis:
    image: redis:7-alpine
    container_name: weknoq_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - weknoq_net

  # ─── AI Tagger Service (Python FastAPI) ────────────────────
  ai-tagger:
    build:
      context: ./services/ai-tagger
      dockerfile: Dockerfile
    container_name: weknoq_ai_tagger
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://weknoq:${POSTGRES_PASSWORD}@postgres:5432/weknoq
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_HOST=${OLLAMA_HOST:-""}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - weknoq_net

  # ─── Nginx Reverse Proxy ───────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: weknoq_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - weknoq_net

volumes:
  postgres_data:
  redis_data:
  certbot_data:

networks:
  weknoq_net:
    driver: bridge
